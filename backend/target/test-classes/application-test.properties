spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.jwt.secret=TestSecretKeyForUnitTestsOnly1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef
app.jwt.expiration-ms=86400000
app.jwt.setup-token-expiration-ms=300000

app.cors.allowed-origins=http://localhost:3000
app.seed.admin.email=admin@test.com
app.seed.admin.password=Admin@1234
app.seed.admin.name=Test Admin
app.admin.registration.code=TEST_CODE
app.totp.encryption.key=TestTotp2024EncryptionKeyForDevTests!

app.mail.enabled=false
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@routesync.com
spring.mail.password=testpassword
