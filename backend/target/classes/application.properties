spring.application.name=routesync

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/routesync_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server
server.port=${SERVER_PORT:8080}
server.error.include-message=always

# JWT
app.jwt.secret=${JWT_SECRET:RouteSyncSystemSecretKey2024VeryLongAndSecureKeyForProduction}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.ktroute=INFO
logging.level.org.springframework.security=WARN

# Capacity Thresholds (configurable)
app.occupancy.underutilized-threshold=40
app.occupancy.overcapacity-threshold=100

# Seed Admin (change before production)
app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@routesync.com}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:Admin@1234}
app.seed.admin.name=${SEED_ADMIN_NAME:System Administrator}

# Admin self-registration code (share only with trusted staff; override via ADMIN_REG_CODE env var in production)
app.admin.registration.code=${ADMIN_REG_CODE:RouteSync@2024}

# 2FA — TOTP secret encryption key (32+ char; MUST override in production via TOTP_ENC_KEY)
app.totp.encryption.key=${TOTP_ENC_KEY:RouteSyncTotp2024EncryptionKeyForDev!}

# JWT setup-token expiry (5 minutes, for 2FA enrollment flow)
app.jwt.setup-token-expiration-ms=300000

